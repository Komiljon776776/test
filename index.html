<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Axborot xavfsizligi — o‘rganish va test</title><style>
:root{--bg:#f2f5f3;--card:#fff;--tx:#17231f;--mu:#5b6b65;--ac:#1f6f6b;--ok:#2e7d4f;--bl:#1d5fd0;--no:#b4432f;--bd:#d5dfda;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b18;--card:#1a2622;--tx:#e6efeb;--mu:#9bb0a8;--ac:#5cc2b8;--ok:#6fcf97;--bl:#7db3ff;--no:#f08a73;--bd:#2c3b36}}
:root[data-theme="dark"]{--bg:#121b18;--card:#1a2622;--tx:#e6efeb;--mu:#9bb0a8;--ac:#5cc2b8;--ok:#6fcf97;--bl:#7db3ff;--no:#f08a73;--bd:#2c3b36}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,'Times New Roman',serif}
#app{max-width:720px;margin:0 auto;padding:14px}
button{font:inherit;color:inherit;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);border-radius:10px}.tabs .on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.hint{color:var(--mu);margin:6px 0 12px}
.g{display:flex;justify-content:space-between;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:1px solid var(--bd);background:var(--card);border-radius:10px}.g span{color:var(--mu)}
.back{border:0;background:none;color:var(--ac);padding:6px 0;margin-bottom:4px}
h2{font-size:21px;margin:4px 0 8px}
.rule{border-left:4px solid var(--ac);background:var(--card);padding:10px 12px;margin:0 0 14px;border-radius:0 8px 8px 0}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.qt{font-weight:bold;margin-bottom:6px}.ok{color:var(--ok);margin:3px 0}.no{color:var(--mu);margin:3px 0}.no small{display:block;color:var(--no)}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;margin:7px 0;border:1px solid var(--bd);background:var(--card);border-radius:10px}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}.opt.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--card))}
.fb{margin:10px 0;padding:10px 12px;border-radius:8px;background:var(--card);border:1px solid var(--bd)}.fb b.o{color:var(--ok)}.fb b.x{color:var(--no)}
.nx{padding:10px 18px;border:0;border-radius:10px;background:var(--ac);color:var(--bg)}
.pr{color:var(--mu);font-size:14px}
.o{padding:9px 12px;margin:6px 0;border:1px solid var(--bd);border-radius:10px}.o.blue{border-color:var(--bl);color:var(--bl);font-weight:bold;background:color-mix(in srgb,var(--bl) 14%,var(--card))}.o small{display:block;font-weight:normal;color:var(--mu)}
.g small{display:block;color:var(--mu);font-size:13px}.g b{font-weight:normal}
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#121214;--card:#18181c;--tx:#f1f1f5;--mu:#9a9aa8;--ac:#6d28d9;--ok:#4ade80;--no:#f87171;--bl:#8ab4ff;--bd:#2c2c33;color-scheme:dark}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#app{padding:16px}
.tabs button{border-radius:14px;padding:12px}.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.g{border-radius:16px;padding:16px}.c{border-radius:20px;padding:16px}
h2{font-size:22px;line-height:1.35;margin:10px 0 16px}
.opt,.o{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:14px;border:1.5px solid var(--bd);background:transparent}
.opt b,.o b{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#2a2140;color:#c4a1ff;font-size:14px}
.opt.good{border-color:#2f9e5b;color:var(--ok);background:#14231a;font-weight:bold}.opt.good b{background:#1b3a28;color:var(--ok)}
.opt.bad{border-color:#b94a48;color:var(--no);background:#2a1618}.opt.bad b{background:#3d1f22;color:var(--no)}
.o.blue{border-color:#2f9e5b;color:var(--ok);background:#14231a;font-weight:bold}.o.blue b{background:#1b3a28;color:var(--ok)}
.bar{height:8px;border-radius:8px;background:#26262c;margin:8px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:8px}
.nx{width:100%;padding:15px;border-radius:14px;background:var(--ac);color:#fff;font-weight:bold}
.fb{border-radius:14px}
mark{background:#facc15;color:#111;padding:1px 4px;border-radius:4px}
.tabs button{padding:12px 4px;font-size:15px}
.o>span{flex:1;min-width:0}
</style></head><body><div id="app"></div><script src="questions.js"></script><script src="config.js"></script><script>const $=s=>document.querySelector(s),app=$('#app'),L='ABCDEFGH';
const e=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const ALL=Q.map((_,i)=>i),B=[];for(let i=0;i<Q.length;i+=30)B.push(ALL.slice(i,i+30));
const perm=(id,n)=>{let s=id*9301+49297,a=[...Array(n).keys()];for(let i=n-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let ST={};try{ST=JSON.parse(localStorage.getItem('axb')||'{}')}catch(x){}
const save=()=>{try{localStorage.setItem('axb',JSON.stringify(ST))}catch(x){}};
let mode='study',T=null,P={};
const lab=bi=>bi=='rand'?'Random 30':bi+1+'-blok';
const tabs=()=>`<div class="pr" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span>${window.ME?e(ME.displayName||ME.email):''}</span><button class="back" data-out="1" style="margin:0">Chiqish</button></div><div class="tabs"><button data-m="study" class="${mode=='study'?'on':''}">O‘rganish</button><button data-m="work" class="${mode=='work'?'on':''}">Test ishlash</button></div>`;
function home(){T=null;app.innerHTML=tabs()+`<p class="hint">${mode=='study'?'30 ta savol to‘g‘ri javobi bilan ko‘rinadi.':'30 talik blokni ishlang: xato bo‘lsa to‘g‘ri javob ham ko‘rsatiladi.'}</p><button class="g" data-b="rand"><div><b>Random 30 talik</b> · ${Q.length} tadan tasodifiy</div></button>`+B.map((b,i)=>{const r=ST[i];return `<button class="g" data-b="${i}"><div><b>${i+1}-blok</b> · ${b[0]+1}–${b[b.length-1]+1}-savollar</div><span>${mode=='work'&&r?r.s+' / '+r.n:''}</span></button>`}).join('')}
function study(bi){const ids=bi=='rand'?sh(ALL).slice(0,30):B[bi];app.innerHTML=`<button class="back" data-h="1">‹ Bloklar</button><h2>${lab(bi)}</h2>`+ids.map((id,n)=>{const q=Q[id];return `<div class="c"><div class="qt">${n+1}. ${e(q.t)}</div>`+perm(id,q.o.length).map((k,m)=>`<div class="o${k==q.c?' blue':''}"><b>${L[m]}</b><span>${e(q.o[k])}</span></div>`).join('')+'</div>'}).join('')+'<button class="back" data-h="1">‹ Bloklar</button>';scrollTo(0,0)}
function start(bi,ids,retry){if(!retry){P={};ids.forEach((id,n)=>P[id]=n+1)}T={bi,ids:retry?sh(ids):ids,i:0,s:0,bad:[],ans:[],retry};ask()}
function ask(){if(T.i>=T.ids.length)return done();const id=T.ids[T.i],q=Q[id];T.lock=0;T.cur=sh(q.o.map((t,k)=>({t,k})));app.innerHTML=`<button class="back" data-h="1">‹ Bloklar</button><div class="pr">${T.retry?'Xatolarni qayta ishlash · ':''}${lab(T.bi)} · ${T.i+1} / ${T.ids.length} · to‘g‘ri: ${T.s}</div><div class="bar"><i style="width:${(T.i+1)/T.ids.length*100}%"></i></div><h2>${P[id]}. ${e(q.t)}</h2>`+T.cur.map((o,j)=>`<button class="opt" data-o="${j}"><b>${L[j]}</b><span>${e(o.t)}</span></button>`).join('')+'<div id="fb"></div>';scrollTo(0,0)}
function pick(j){if(T.lock)return;T.lock=1;const id=T.ids[T.i],q=Q[id],o=T.cur[j],bs=document.querySelectorAll('.opt');let ci=0;T.cur.forEach((x,n)=>{if(x.k==q.c){bs[n].classList.add('good');ci=n}});const ok=o.k==q.c;T.ans.push({id,k:o.k,ok});if(ok)T.s++;else{bs[j].classList.add('bad');T.bad.push(id)}
$('#fb').innerHTML=`<div class="fb">${ok?'<b class="o">To‘g‘ri.</b>':'<b class="x">Xato.</b> To‘g‘ri javob: <b>'+L[ci]+'</b>'}</div><button class="nx" data-n="1">${T.i+1<T.ids.length?'Keyingi':'Natijani ko‘rish'}</button>`}
function done(){const n=T.ids.length;if(!T.retry&&T.bi!='rand'){ST[T.bi]={s:T.s,n};save()}if(!T.retry&&window.saveResult)saveResult({block:lab(T.bi),s:T.s,n,q:T.ids,w:T.bad,a:T.ans});app.innerHTML=`<button class="back" data-h="1">‹ Bloklar</button><h2>${T.retry?'Qayta ishlash':lab(T.bi)}: ${T.s} / ${n}</h2>`+(T.bi=='rand'&&!T.retry?'<button class="nx" data-b="rand" style="margin-bottom:10px">Yangi random 30 talik</button>':'')+(T.bad.length?`<button class="nx" data-r="1">Xatolarni qayta ishlash (${T.bad.length})</button><p class="hint">Xato qilingan savollar:</p>`+T.bad.map(id=>`<div class="c"><div class="qt">${P[id]}. ${e(Q[id].t)}</div><div class="o blue"><span>${e(Q[id].o[Q[id].c])}</span></div></div>`).join(''):'<p>Hammasi to‘g‘ri!</p>')}
app.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
if(d.m){mode=d.m;home()}else if(d.h)home();else if(d.b!==undefined){const bi=d.b=='rand'?'rand':+d.b;mode=='study'?study(bi):start(bi,bi=='rand'?sh(ALL).slice(0,30):B[bi],0)}else if(d.o!==undefined)pick(+d.o);else if(d.n){T.i++;ask()}else if(d.r)start(T.bi,T.bad,1)}
window.startApp=home;</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const fb=initializeApp(FB_CONFIG),auth=getAuth(fb),db=getFirestore(fb);
const qh=t=>{let h=5381;for(const c of t)h=((h<<5)+h+c.codePointAt(0))>>>0;return h.toString(36)};
window.ME=null;
const login=m=>{app.innerHTML='<div class="c" style="text-align:center;margin-top:40px"><h2>Axborot xavfsizligi testi</h2><p class="hint">Davom etish uchun Google hisobingiz bilan kiring.</p><button class="nx" data-login="1">Google bilan kirish</button><p class="hint">'+(m||'')+'</p></div>'};
onAuthStateChanged(auth,u=>{window.ME=u;u?startApp():login()});
document.addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b)return;
if(b.dataset.login){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(x){login('Kirishda xato: '+(x.code||x.message))}}
if(b.dataset.out)signOut(auth)});
window.saveResult=async r=>{try{await addDoc(collection(db,'results'),{uid:ME.uid,name:ME.displayName||'',email:ME.email||'',block:r.block,s:r.s,n:r.n,q:r.q.map(i=>qh(Q[i].t)),w:r.w.map(i=>qh(Q[i].t)),a:(r.a||[]).map(x=>({h:qh(Q[x.id].t),k:x.k,ok:x.ok?1:0})),ts:serverTimestamp()})}catch(x){console.error(x)}};
</script></body></html>
